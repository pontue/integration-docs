<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Pontue Integration Docs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <div id="app"></div>

    <script src="./standalone.js"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: './openapi/openapi.yaml',
        authentication: { preferredSecurityScheme: 'Authorization' },
        orderSchemaPropertiesBy: 'preserve',
        documentDownloadType: 'none',
        hideModels: true,
        agent: { disabled: true },
        mcp: { disabled: true },
        showDeveloperTools: 'never',
        telemetry: false,
        layout: 'modern',
        theme: 'kepler',
        localization: {
          locale: 'pt',
        },
        darkMode: true,
        favicon: './favicon.png',
      })
    </script>
  </body>
</html>
